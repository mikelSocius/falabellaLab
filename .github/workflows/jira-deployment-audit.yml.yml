name: "Jira Deployment Record - API"

on:
  workflow_run:
    workflows: ["release"]  # Reemplaza por el 'name' de tu workflow origen
    types:
      - completed

jobs:
  create-jira-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Generar Deployment Record en Jira via API
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          
          # Datos del evento workflow_run
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_commit.id }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          REPO_URL: ${{ github.event.repository.html_url }}
          APP_NAME: ${{ github.event.repository.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].html_url }}
        run: |
          # 1. Determinar Ambiente según la rama
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            ENV_VALUE="PROD"
          else
            ENV_VALUE="QA"
          fi

          # 3. Formatear fechas y SHA
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          FECHA_SOLICITADA=$(date -u +"%Y-%m-%dT%H:%M:%S.000-0300")
          FECHA_TERMINO=$(date -u +"%Y-%m-%dT%H:%M:%S.000-0300")
          PR_LINK="${PR_URL:-$REPO_URL}"

          # 4. Construir Payload JSON (IDs estándar del proyecto PT)
          PAYLOAD=$(cat <<EOF
          {
            "fields": {
              "project": { "key": "PT" },
              "issuetype": { "name": "Deployment" },
              "summary": "[DEPLOYMENT][$ENV_VALUE][$APP_NAME] $SHORT_SHA",
              "description": {
                "type": "doc",
                "version": 1,
                "content": [
                  {
                    "type": "paragraph",
                    "content": [{ "type": "text", "text": "$COMMIT_MSG" }]
                  }
                ]
              },
              "customfield_10761": { "value": "CL" },
              "customfield_10762": { "value": "$ENV_VALUE" },
              "customfield_10763": "$APP_NAME",
              "customfield_10764": { "value": "Desarrollo" },
              "customfield_10765": { "value": "Normal" },
              "customfield_10766": "$REPO_URL",
              "customfield_10767": "$PR_LINK",
              "customfield_10768": "$SHORT_SHA",
              "customfield_10769": "$FECHA_SOLICITADA",
              "customfield_10770": { "value": "$RESULT_VALUE" },
              "customfield_10771": "$FECHA_TERMINO",
              "customfield_10772": "Ejecución automatizada desde GitHub Actions. Logs: $WORKFLOW_URL",
              "customfield_10773": { "value": "Fanatizar" },
              "customfield_10774": { "value": "Portainer" },
              "customfield_10775": { "value": "GitHub Actions" }
            }
          }
          EOF
          )

          # 5. Envío a Jira REST API
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$JIRA_BASE_URL/rest/api/3/issue" \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)

          echo "Respuesta HTTP: $HTTP_CODE"
          echo "$HTTP_BODY"

          if [ "$HTTP_CODE" -ne 201 ]; then
            echo "Error creando Deployment Record en Jira"
            exit 1
          fi
